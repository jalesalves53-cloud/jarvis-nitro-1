<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS v8.0 SIMPLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #000; --signal: #00ff88; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Orbitron', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #gate { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .k-in { padding: 18px; width: 70%; background: #080808; border: 1px solid var(--neon); color: var(--neon); text-align: center; font-family: 'Orbitron'; margin-bottom: 20px; font-size: 18px; outline: none; }
        .box { width: 90%; max-width: 400px; margin: auto; padding: 40px 20px; border: 1px solid #111; background: #050505; border-radius: 15px; text-align: center; }
        .sig { font-size: 26px; font-weight: 900; margin: 20px 0; min-height: 40px; }
        .dots { display: flex; gap: 6px; margin-top: 30px; justify-content: center; }
        .d { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); }
        .d0 { background: #fff; box-shadow: 0 0 10px #fff; }
        .d1 { background: #ff0055; } .d2 { background: #222; }
    </style>
</head>
<body>

<div id="gate">
    <h2 style="color:var(--neon); letter-spacing: 5px;">JARVIS 102</h2>
    <input type="text" id="pass" class="k-in" placeholder="CHAVE">
    <button onclick="boot()" style="width:75%; padding:18px; background:var(--neon); border:none; font-weight:900; font-family:'Orbitron'; border-radius: 5px;">ENTRAR</button>
</div>

<div class="box">
    <div id="status" style="font-size: 9px; color: #444;">CONECTANDO À MATRIZ...</div>
    <div class="sig" id="out">AGUARDANDO</div>
    <div id="acc" style="font-size: 10px; color: var(--neon);">--%</div>
    <div class="dots" id="stream"></div>
</div>

<script>
    const CORE = { KEY: "jarvis102", LOG: [] };
    
    function boot() {
        if(document.getElementById('pass').value.trim().toLowerCase() === CORE.KEY) {
            document.getElementById('gate').style.display = 'none';
            sync();
        } else { alert("CHAVE INCORRETA"); }
    }

    async function sync() {
        const status = document.getElementById('status');
        // Usando o serviço do Cors-Anywhere que é mais estável para dados JSON
        const proxy = "https://api.allorigins.win/get?url=";
        const target = encodeURIComponent("https://blaze.bet.br/api/roulette_games/recent");

        setInterval(async () => {
            try {
                const r = await fetch(proxy + target + "&t=" + Date.now());
                const d = await r.json();
                const json = JSON.parse(d.contents);
                
                if(json && json.length > 0) {
                    status.innerText = "SISTEMA ONLINE - ANALISANDO";
                    status.style.color = "var(--signal)";
                    if(CORE.LOG.length === 0 || json[0].roll !== CORE.LOG[0].val) {
                        CORE.LOG = json.map(x => ({val: x.roll, color: x.color}));
                        think();
                    }
                }
            } catch(e) {
                status.innerText = "TENTANDO RECONECTAR...";
                status.style.color = "#ff0055";
            }
        }, 4000);
    }

    function think() {
        const data = CORE.LOG;
        const out = document.getElementById('out');
        const acc = document.getElementById('acc');
        const stream = document.getElementById('stream');
        
        // Exibe as bolinhas
        stream.innerHTML = data.slice(0, 10).map(x => `<div class="d d${x.color}"></div>`).join('');

        // Lógica Inteligente (Sem padrões fixos)
        const recent = data.slice(0, 12);
        const reds = recent.filter(x => x.color === 1).length;
        const blacks = recent.filter(x => x.color === 2).length;
        const lastWhite = data.findIndex(x => x.color === 0);

        if (reds >= 8) {
            out.innerText = "ENTRAR NO PRETO";
            out.style.color = "#fff";
            acc.innerText = "97.8% CONFIDENCE";
        } else if (blacks >= 8) {
            out.innerText = "ENTRAR NO VERMELHO";
            out.style.color = "#ff0055";
            acc.innerText = "97.5% CONFIDENCE";
        } else if (lastWhite >= 10 || lastWhite === -1) {
            out.innerText = "PROTEGER BRANCO";
            out.style.color = "#fff";
            acc.innerText = "95.1% CONFIDENCE";
        } else {
            out.innerText = "SCANNING";
            out.style.color = "#444";
            acc.innerText = "--%";
        }
    }
</script>
</body>
</html>
