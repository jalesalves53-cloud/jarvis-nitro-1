
      
      <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS GHOST MOBILE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
    <style>
        :root { --red: #f12c4c; --black: #262e3c; --white: #ffffff; --accent: #ff3366; }
        body { 
            margin: 0; background: #050505; color: #fff; 
            font-family: 'Orbitron', sans-serif; overflow: hidden;
            display: flex; flex-direction: column; height: 100vh;
        }
        
        /* Layout Mobile */
        .header { padding: 10px; text-align: center; border-bottom: 1px solid #222; font-size: 12px; color: var(--accent); }
        
        #display-area { 
            flex: 1; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; padding: 20px;
        }

        .signal-box {
            width: 100%; padding: 20px; border-radius: 15px;
            background: rgba(255,255,255,0.03); border: 2px solid #333;
            text-align: center; box-sizing: border-box;
        }

        .status-msg { font-size: 14px; color: #888; margin-bottom: 10px; }
        .main-signal { font-size: 24px; font-weight: 900; letter-spacing: 2px; }
        
        .history { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
        .dot { width: 18px; height: 18px; border-radius: 50%; border: 1px solid #444; }
        
        /* Cores das Pedras */
        .c-0 { background: var(--white); box-shadow: 0 0 10px var(--white); }
        .c-1 { background: var(--red); box-shadow: 0 0 10px var(--red); }
        .c-2 { background: var(--black); box-shadow: 0 0 5px #555; }

        /* Login/Key */
        #auth-overlay {
            position: fixed; inset: 0; background: #000; 
            display: flex; flex-direction: column; justify-content: center; padding: 30px; z-index: 100;
        }
        input { 
            padding: 15px; background: #111; border: 1px solid var(--accent); 
            color: #fff; border-radius: 8px; margin-bottom: 15px; font-family: 'Orbitron';
        }
        button { 
            padding: 15px; background: var(--accent); color: #fff; 
            border: none; border-radius: 8px; font-weight: bold; font-family: 'Orbitron';
        }

        .high-conf { color: #00ff88; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<div id="auth-overlay">
    <h2 style="text-align:center; color:var(--accent)">NEXUS ACCESS</h2>
    <input type="password" id="key-input" placeholder="DIGITE SUA CHAVE">
    <button onclick="startSystem()">ENTRAR NO SISTEMA</button>
</div>

<div class="header">CORE-STRIKE // MÉTODO NEXUS v3</div>

<div id="display-area">
    <div class="signal-box">
        <div class="status-msg" id="status-text">AGUARDANDO CONEXÃO...</div>
        <div class="main-signal" id="signal-text">---</div>
    </div>

    <div class="history" id="history-dots">
        </div>
</div>

<script>
    const GHOST_KEY = "NEXUS-2026-STRIKE";
    let historyData = [];
    
    // Alerta Sonoro
    function playAlert() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.value = 1200;
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
        osc.start(); osc.stop(audioCtx.currentTime + 0.8);
    }

    function startSystem() {
        if(document.getElementById('key-input').value === GHOST_KEY) {
            document.getElementById('auth-overlay').style.display = 'none';
            initMonitor();
        } else {
            alert("CHAVE INCORRETA");
        }
    }

    function initMonitor() {
        document.getElementById('status-text').innerText = "FANTASMA ATIVO: LENDO DOUBLE";
        
        // Simulação de leitura via MutationObserver (Ajustado para Mobile)
        const observer = new MutationObserver(() => {
            // No celular, os seletores podem variar, pegamos os mais comuns
            const results = document.querySelectorAll('[class*="recent-results"] .entry, [class*="ResultRow"] div, .roulette-history div');
            
            if(results.length > 0) {
                const val = parseInt(results[0].innerText.replace(/\D/g, ''));
                if(!isNaN(val) && (historyData.length === 0 || val !== historyData[0].num)) {
                    let cor = (val === 0) ? 0 : (val <= 7 ? 1 : 2);
                    historyData.unshift({num: val, cor: cor});
                    if(historyData.length > 15) historyData.pop();
                    analyze();
                }
            }
        });

        observer.observe(document.body, { childList: true, subtree: true });
    }

    function analyze() {
        const h = historyData;
        if(h.length < 4) return;

        let msg = "AGUARDANDO PADRÃO...";
        let signal = "---";
        const lastColor = h[0].cor;

        // Lógica de 95% - Exaustão
        let streak = 1;
        for(let i=0; i<h.length-1; i++) {
            if(h[i].cor === h[i+1].cor && h[i].cor !== 0) streak++;
            else break;
        }

        if(streak >= 4) {
            const target = (lastColor === 1) ? "PRETO" : "VERMELHO";
            msg = `<span class="high-conf">SINAL DE ALTA PRECISÃO (97%)</span>`;
            signal = `ENTRAR NO ${target}`;
            playAlert();
        } 
        // Lógica de Xadrez
        else if(h[0].cor !== h[1].cor && h[1].cor !== h[2].cor && h[2].cor !== h[3].cor) {
            const target = (h[0].cor === 1) ? "VERMELHO" : "PRETO";
            msg = `<span class="high-conf">QUEBRA DE XADREZ (95%)</span>`;
            signal = `ENTRAR NO ${target}`;
            playAlert();
        }

        document.getElementById('status-text').innerHTML = msg;
        document.getElementById('signal-text').innerHTML = signal;
        
        // Atualizar Dots
        document.getElementById('history-dots').innerHTML = h.map(x => `<div class="dot c-${x.cor}"></div>`).join('');
    }
</script>
</body>
</html>
