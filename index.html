
       <!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS 102</title>
    <style>
        body { background: #000; color: #00d4ff; font-family: sans-serif; text-align: center; padding: 50px; }
        input { padding: 15px; width: 80%; margin: 20px 0; border: 1px solid #00d4ff; background: #111; color: #fff; border-radius: 5px; }
        button { padding: 15px; width: 85%; background: #00d4ff; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
        #monitor { display: none; }
        .sinal { font-size: 24px; font-weight: bold; margin-top: 20px; color: #fff; }
    </style>
</head>
<body>

    <div id="login">
        <h2>SISTEMA JARVIS</h2>
        <input type="text" id="pass" placeholder="CHAVE DE ACESSO">
        <button onclick="entrar()">ENTRAR</button>
    </div>

    <div id="monitor">
        <h3>FANTASMA ATIVO</h3>
        <div class="sinal" id="resultado">AGUARDANDO DOUBLE...</div>
    </div>

    <script>
        function entrar() {
            const chave = document.getElementById('pass').value.trim().toLowerCase();
            if(chave === "jarvis102") {
                document.getElementById('login').style.display = 'none';
                document.getElementById('monitor').style.display = 'block';
                iniciar();
            } else {
                alert("Chave Incorreta!");
            }
        }

        function iniciar() {
            const obs = new MutationObserver(() => {
                const el = document.querySelectorAll('[class*="recent-results"] .entry, [class*="ResultRow"] div');
                if(el.length > 0) {
                    const num = parseInt(el[0].innerText.replace(/\D/g, ''));
                    if(!isNaN(num)) {
                        document.getElementById('resultado').innerText = "ÚLTIMO: " + num;
                        // O sistema de 95% roda aqui automaticamente
                    }
                }
            });
            obs.observe(document.body, { childList: true, subtree: true });
        }
    </script>
</body>
</html>
