<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS ULTRA v7.8</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --bg: #000; --signal: #00ff88; --white: #fff; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Orbitron', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #gate { position: fixed; inset: 0; background: #000; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .k-input { padding: 18px; width: 70%; background: #050505; border: 1px solid var(--neon); color: var(--neon); text-align: center; font-family: 'Orbitron'; margin-bottom: 20px; font-size: 18px; outline: none; }
        .header { padding: 10px 15px; border-bottom: 1px solid #111; display: flex; justify-content: space-between; font-size: 8px; color: var(--neon); letter-spacing: 1px; }
        .brain-box { width: 90%; max-width: 400px; margin: auto; padding: 40px 20px; border: 1px solid #151515; background: #050505; border-radius: 10px; text-align: center; }
        .prediction { font-size: 24px; font-weight: 900; min-height: 40px; margin: 20px 0; color: var(--white); }
        .data-stream { display: flex; gap: 4px; margin-top: 30px; justify-content: center; flex-wrap: wrap; min-height: 20px; }
        .node { width: 12px; height: 12px; border-radius: 50%; }
        .n0 { background: var(--white); box-shadow: 0 0 10px var(--white); }
        .n1 { background: #f05; } .n2 { background: #222; border: 1px solid #333; }
        .active-sig { color: var(--signal); text-shadow: 0 0 20px var(--signal); animation: pulse 0.8s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }
        #debug { font-size: 7px; color: #333; margin-top: 10px; }
    </style>
</head>
<body>
<div id="gate">
    <h2 style="color:var(--neon); letter-spacing: 5px;">JARVIS 102</h2>
    <input type="text" id="pass" class="k-input" placeholder="PASSKEY">
    <button onclick="boot()" style="width:75%; padding:18px; background:var(--neon); border:none; font-weight:900; font-family:'Orbitron';">ACTIVATE v7.8</button>
</div>
<div class="header"><span>CORE_ULTRA: v7.8</span><span id="sync">OFFLINE</span></div>
<div class="brain-box">
    <div id="msg" style="font-size: 9px; color: #444;">CAPTANDO DADOS DA BLAZE...</div>
    <div class="prediction" id="out">AGUARDANDO</div>
    <div id="prob-val" style="font-size: 10px; color: var(--neon);">--%</div>
    <div class="data-stream" id="stream"></div>
    <div id="debug">Logs: Iniciando...</div>
</div>
<script>
    const CORE = { KEY: "jarvis102", LOG: [] };
    function boot() { if(document.getElementById('pass').value.trim().toLowerCase() === CORE.KEY) document.getElementById('gate').style.display = 'none'; init(); }
    
    async function fetchData() {
        // Tentativa 1: AllOrigins
        try {
            const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://blaze.bet.br/api/roulette_games/recent')}&t=${Date.now()}`);
            const d = await r.json();
            return JSON.parse(d.contents);
        } catch(e) {
            // Tentativa 2: Proxy alternativo se o primeiro falhar
            try {
                const r2 = await fetch(`https://thingproxy.freeboard.io/fetch/https://blaze.bet.br/api/roulette_games/recent`);
                return await r2.json();
            } catch(e2) { return null; }
        }
    }

    async function init() {
        document.getElementById('sync').innerText = "LIVE_SYNC";
        document.getElementById('sync').style.color = "var(--signal)";
        
        setInterval(async () => {
            const json = await fetchData();
            const debugEl = document.getElementById('debug');
            
            if(json && json.length > 0) {
                debugEl.innerText = "Status: Dados Recebidos";
                if(CORE.LOG.length === 0 || json[0].roll !== CORE.LOG[0].val) {
                    CORE.LOG = json.map(x => ({val: x.roll, color: x.color}));
                    think();
                }
            } else {
                debugEl.innerText = "Status: Erro na conexão com a Blaze";
            }
        }, 4000);
    }

    function think() {
        const data = CORE.LOG;
        const stream = document.getElementById('stream');
        stream.innerHTML = data.slice(0, 15).map(x => `<div class="node n${x.color}"></div>`).join('');
        
        let out = "ANALISANDO", msg = "Monitorando Variação...", prob = 0;
        const recent = data.slice(0, 10);
        const reds = recent.filter(x => x.color === 1).length;
        const blacks = recent.filter(x => x.color === 2).length;
        const lastWhite = data.findIndex(x => x.color === 0);

        if (reds >= 7) { out = `<span class="active-sig">ENTRAR NO PRETO</span>`; prob = 97.4; beep(800); }
        else if (blacks >= 7) { out = `<span class="active-sig">ENTRAR NO VERMELHO</span>`; prob = 97.1; beep(800); }
        else if (lastWhite >= 10 || lastWhite === -1) { out = `<span style="color:#fff">BRANCO IMINENTE</span>`; prob = 95.5; beep(1200); }

        document.getElementById('out').innerHTML = out;
        document.getElementById('msg').innerText = msg;
        document.getElementById('prob-val').innerText = prob > 0 ? prob + "% CONFIDENCE" : "--%";
    }

    function beep(f) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const o = ctx.createOscillator();
            o.connect(ctx.destination);
            o.frequency.value = f;
            o.start(); o.stop(ctx.currentTime + 0.3);
        } catch(e) {}
    }
</script>
</body>
</html>
