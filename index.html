<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS GHOST - Mark 369</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
    <style>
        :root { --red: #f12c4c; --black: #262e3c; --white: #ffffff; --accent: #ff3366; --success: #00ff88; }
        body { 
            margin: 0; background: #050505; color: #fff; 
            font-family: 'Orbitron', sans-serif; overflow: hidden;
            display: flex; flex-direction: column; height: 100vh;
        }
        
        #auth-overlay {
            position: fixed; inset: 0; background: #000; 
            display: flex; flex-direction: column; justify-content: center; padding: 30px; z-index: 100;
        }
        input { 
            padding: 15px; background: #111; border: 1px solid var(--accent); 
            color: #fff; border-radius: 8px; margin-bottom: 15px; font-family: 'Orbitron'; text-align: center;
        }
        button { 
            padding: 15px; background: var(--accent); color: #fff; 
            border: none; border-radius: 8px; font-weight: bold; font-family: 'Orbitron'; cursor: pointer;
        }

        .header { padding: 10px; text-align: center; border-bottom: 1px solid #222; font-size: 11px; color: var(--accent); letter-spacing: 1px; }
        #display-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .signal-box { width: 100%; padding: 25px; border-radius: 15px; background: rgba(255,255,255,0.03); border: 1px solid #333; text-align: center; }
        .status-msg { font-size: 12px; color: #888; margin-bottom: 10px; text-transform: uppercase; }
        .main-signal { font-size: 22px; font-weight: 900; color: var(--white); }
        
        .history { display: flex; gap: 6px; margin-top: 25px; justify-content: center; }
        .dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid #444; }
        .c-0 { background: var(--white); box-shadow: 0 0 10px var(--white); }
        .c-1 { background: var(--red); box-shadow: 0 0 10px var(--red); }
        .c-2 { background: var(--black); }

        .high-conf { color: var(--success); text-shadow: 0 0 15px var(--success); }
    </style>
</head>
<body>

<div id="auth-overlay">
    <h2 style="text-align:center; color:var(--accent); font-size: 18px;">SISTEMA NEXUS</h2>
    <p style="text-align:center; font-size: 10px; color: #555; margin-bottom: 20px;">AGUARDANDO CHAVE DE ACESSO</p>
    <input type="text" id="key-input" placeholder="ACCESS KEY" autocomplete="off">
    <button onclick="startSystem()">DESBLOQUEAR MARK 369</button>
</div>

<div class="header">CORE-STRIKE // MÉTODO NEXUS v3.1</div>

<div id="display-area">
    <div class="signal-box">
        <div class="status-msg" id="status-text">Sincronizando...</div>
        <div class="main-signal" id="signal-text">AGUARDANDO DADOS</div>
    </div>
    <div class="history" id="history-dots"></div>
</div>

<script>
    // Configuração de Identidade e Chave
    const CONFIG = {
        KEY: "Mark 369",
        VERSION: "3.1.0"
    };

    let historyData = [];

    // Alerta Sonoro de Alta Confiança
    function playAlert() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = 900;
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } catch(e) { console.log("Audio bloqueado"); }
    }

    function startSystem() {
        const input = document.getElementById('key-input').value.trim();
        
        // Validação Mark 369 (Ignora espaços extras)
        if(input === CONFIG.KEY) {
            document.getElementById('auth-overlay').style.display = 'none';
            initMonitor();
        } else {
            alert("ACESSO NEGADO: CHAVE INCORRETA");
            document.getElementById('key-input').value = "";
        }
    }

    function initMonitor() {
        document.getElementById('status-text').innerText = "FANTASMA ATIVO";
        
        const observer = new MutationObserver(() => {
            const entries = document.querySelectorAll('[class*="recent-results"] .entry, [class*="ResultRow"] div, .roulette-history div');
            
            if(entries.length > 0) {
                const val = parseInt(entries[0].innerText.replace(/\D/g, ''));
                if(!isNaN(val) && (historyData.length === 0 || val !== historyData[0].num)) {
                    let cor = (val === 0) ? 0 : (val <= 7 ? 1 : 2);
                    historyData.unshift({num: val, cor: cor});
                    if(historyData.length > 12) historyData.pop();
                    analyze();
                }
            }
        });

        observer.observe(document.body, { childList: true, subtree: true });
    }

    function analyze() {
        if(historyData.length < 4) return;
        
        let msg = "Monitorando Padrões...";
        let signal = "AGUARDE";
        const h = historyData;

        // Lógica de Alta Probabilidade (Exaustão)
        let streak = 1;
        for(let i=0; i<h.length-1; i++) {
            if(h[i].cor === h[i+1].cor && h[i].cor !== 0) streak++;
            else break;
        }

        if(streak >= 4) {
            const target = (h[0].cor === 1) ? "PRETO" : "VERMELHO";
            msg = `<span class="high-conf">GATILHO CONFIRMADO (97%)</span>`;
            signal = `ENTRAR NO ${target}`;
            playAlert();
        } 
        // Lógica de Xadrez
        else if(h[0].cor !== h[1].cor && h[1].cor !== h[2].cor && h[2].cor !== h[3].cor) {
            const target = (h[0].cor === 1) ? "VERMELHO" : "PRETO";
            msg = `<span class="high-conf">QUEBRA XADREZ (95%)</span>`;
            signal = `ENTRAR NO ${target}`;
            playAlert();
        }

        document.getElementById('status-text').innerHTML = msg;
        document.getElementById('signal-text').innerHTML = signal;
        document.getElementById('history-dots').innerHTML = h.map(x => `<div class="dot c-${x.cor}"></div>`).join('');
    }
</script>
</body>
</html>
